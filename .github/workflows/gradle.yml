name: Gradle build and publish

on:
  push:
    branches: [ "master", "dev", "pers/abalakin/publish"]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and Publish
        run: >
          ./gradlew shadowJar publish 
          -PcommitHash=$(git rev-parse --short "$GITHUB_SHA") 
          -PbuildNumber=${{ github.run_number }} 
          -PisRelease=${{ github.ref == 'refs/heads/master' }}
        env:
          # Имя пользователя жестко задано, так как оно привязано к токену, но можно тоже вынести в Secrets
          REPOSILITE_USER: github
          # Токен берем из секретов GitHub
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: '${{ github.event.repository.name }}'
          path: build/libs