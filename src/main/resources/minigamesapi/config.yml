# MiniGamesAPI config (stored under plugins/<HostPlugin>/minigamesapi/config.yml)
# This file is separate from the host plugin's config.yml to avoid name conflicts.

# Name/key of the current game mode that uses MiniGamesAPI (used for match results, etc.)
mode:
  name: "minigame"

spartakiad:
  enabled: false
  minigame_name: "minigame"
  attempts: 5
  team_mode: false

uuid:
  use_libre_login: true

storage:
  debounce_millis: 500
  close_timeout_millis: 5000

teams:
  players_file: "teams.txt"
