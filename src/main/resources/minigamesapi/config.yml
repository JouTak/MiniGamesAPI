minigamesapi:
  # Служебный маркер, чтобы отличать конфиг API от конфига режима.
  config_version: 1

mode:
  # Логическое имя режима (используется как mode_key в results и для кросс-режимной логики).
  name: "minigame"

uuid:
  # Использовать LibreLogin UUID (через reflection). Если LibreLogin не установлен — будет fallback на Bukkit UUID.
  use_libre_login: true

storage:
  # Дебаунс записи YAML-конфига (мс)
  debounce_millis: 500
  # Таймаут graceful-shutdown для фонового writer thread (мс)
  close_timeout_millis: 5000

spartakiad:
  # Включить спартакиадку (whitelist + attempts + победители)
  enabled: false
  # Название режима/папки для данных спартакиады внутри plugins/<Plugin>/minigamesapi/
  minigame_name: "minigame"
  # Количество попыток по умолчанию
  attempts: 5
  # team_mode=true: whitelist.yml трактуется как команды (teamlist), иначе как список ников
  team_mode: false

matchmaking:
  start:
    # Разрешить старт матча при неполном инстансе (как в BedWars/CreakyWars), если достигнут порог.
    # Полный инстанс ВСЕГДА стартует как раньше.
    enabled: false

    # Минимальная доля заполнения (0.0..1.0) для старта.
    # Пример: 0.5 значит "стартуем, когда занята хотя бы половина слотов".
    min_fill_percent: 1.0

    # Минимальное количество непустых команд для старта.
    # Порог по игрокам: ceil(maxPlayers * min_fill_percent) в пределах [1..maxPlayers]. Дополнительно требуется min_teams непустых команд.
    min_teams: 2

    # Задержка (сек), в течение которой порог должен удерживаться.
    # Если игроков/команд стало меньше порога — старт отменяется.
    delay_seconds: 0

    # Громкие сообщения в чат участникам ожидания (как в CreakyWars):
    # "до начала игры ... если не наберётся полный матч".
    announce:
      enabled: true
      # Как часто писать в чат (сек). В последние last_seconds_always секунд пишет каждый тик.
      interval_seconds: 5
      last_seconds_always: 5
      # Поддерживаемые плейсхолдеры: {seconds}, {current}, {max}, {required}, {teams_current}, {teams_required}
      message: "&eДо начала игры &6{seconds}&e сек. Если не наберётся полный матч — стартуем."
      cancelled_message: "&cСтарт отменён: недостаточно игроков или команд."
      ready_message: "&aМатч стартует неполным составом (&f{current}&a/&f{max}&a, команд &f{teams_current}&a)."

lobby:
  items:
    enabled: true
    # Настраиваемые предметы в хотбаре лобби.
    # Служебный id кладётся в PDC и используется LobbyItemsListener.
    hotbar:
      - id: quick_ready
        enabled: true
        slot: 2
        material: BLAZE_ROD
        name: "&aГотов"
        lore:
          - "&7Быстро встать в очередь"
        action:
          type: READY
      - id: team_select
        enabled: true
        slot: 4
        material: BREEZE_ROD
        name: "&bВыбор команды"
        lore:
          - "&7Открыть меню выбора команды"
        action:
          type: TEAM_SELECT
      - id: lobby_return
        enabled: true
        slot: 6
        material: RESIN_BRICK
        name: "&eВ лобби"
        lore:
          - "&7Вернуться в лобби"
        action:
          type: COMMAND
          command: "lobby"
          deny_message: "&cКоманда недоступна."

teamselect:
  title: "&8Выбор команды"
  # Настройки GUI выбора команды (1..16).
