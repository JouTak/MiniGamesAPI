# =========================
# MiniGamesAPI configuration
# =========================
#
# ВАЖНО:
# - Этот файл хранится в подпапке плагина: <dataFolder>/minigamesapi/config.yml

uuid:
  # Использовать LibreLogin UUID resolver (если LibreLogin установлен и доступен через reflection).
  use_libre_login: true

storage:
  # Анти-спам сохранения YAML (дебаунс).
  debounce_millis: 500
  # Таймаут закрытия executor'а при disable().
  close_timeout_millis: 5000

spartakiad:
  enabled: false
  # Имя мини-игры (используется как подпапка в dataFolder для данных спартакиады).
  minigame_name: "minigame"
  attempts: 5
  team_mode: false

# -------------------------
# Lobby items (hotbar)
# -------------------------
lobby:
  items:
    enabled: true
    # Список предметов, которые выдаются игроку в лобби.
    # slot — 0..8 (хотбар).
    hotbar:
      - id: quick_ready
        enabled: true
        slot: 0
        material: EMERALD
        name: "&aГотов"
        lore:
          - "&7Быстро встать в очередь"
        action:
          type: READY

      - id: team_select
        enabled: true
        slot: 1
        material: NETHER_STAR
        name: "&bВыбор команды"
        lore:
          - "&7Открыть меню выбора команды"
        action:
          type: TEAM_SELECT

      - id: lobby_return
        enabled: true
        slot: 8
        material: RED_BED
        name: "&eВ лобби"
        lore:
          - "&7Телепорт в лобби"
        action:
          type: COMMAND
          command: "lobby"
          deny_message: "&cКоманда /lobby недоступна."

# -------------------------
# Team select GUI
# -------------------------
teamselect:
  # Заголовок меню выбора команды
  title: "&8Выбор команды"

  # Внешний вид команд в GUI (от 1 до 16).
  # material — иконка в меню (любой Material).
  # color — цвет названия (NamedTextColor): RED, BLUE, DARK_PURPLE, GOLD, GRAY и т.д.
  # name (опционально) — кастомное имя команды; если не задано, будет "Команда N".
  teams:
    "1":  { material: RED_WOOL,        color: RED }
    "2":  { material: YELLOW_WOOL,     color: YELLOW }
    "3":  { material: GREEN_WOOL,      color: GREEN }
    "4":  { material: BLUE_WOOL,       color: BLUE }
    "5":  { material: PURPLE_WOOL,     color: DARK_PURPLE }
    "6":  { material: ORANGE_WOOL,     color: GOLD }
    "7":  { material: PINK_WOOL,       color: LIGHT_PURPLE }
    "8":  { material: CYAN_WOOL,       color: AQUA }
    "9":  { material: LIME_WOOL,       color: GREEN }
    "10": { material: LIGHT_BLUE_WOOL, color: AQUA }
    "11": { material: MAGENTA_WOOL,    color: LIGHT_PURPLE }
    "12": { material: BROWN_WOOL,      color: DARK_RED }
    "13": { material: BLACK_WOOL,      color: DARK_GRAY }
    "14": { material: WHITE_WOOL,      color: WHITE }
    "15": { material: GRAY_WOOL,       color: GRAY }
    "16": { material: LIGHT_GRAY_WOOL, color: GRAY }
